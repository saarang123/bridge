[project]
name = "bridge-server"
version = "0.1.0"
description = "Personal mini-app bridge server with HTTP and MCP surfaces."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
bridge = "bridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]
