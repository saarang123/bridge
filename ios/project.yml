name: Bridge
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bridge:
    type: application
    platform: iOS
    sources:
      - Bridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.local.bridge
        INFOPLIST_FILE: Bridge/Info.plist
        SWIFT_VERSION: "5.0"
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
